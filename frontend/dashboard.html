<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard · Attendance</title>
  <link rel="stylesheet" href="frontend/style.css"/>
</head>
<body>
  <div id="navbar"></div>

  <div class="container">
    <div class="card">
      <div class="profile">
        <div class="info">
          <h2 id="username">—</h2>
          <span id="roleBadge" class="role-badge user">user</span>

          <div class="meta">
            <div>User ID<strong id="userId">—</strong></div>
            <div>Member since<strong id="memberSince">—</strong></div>
          </div>
        </div>

        <div class="qr-panel">
          <img id="qrImg" alt="Your QR code" />
          <button id="downloadPdfBtn" class="ghost">Download as PDF</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
  <script type="module" src="frontend/dashboard.js"></script>
</body>
</html>
