<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request access · Attendance</title>
  <link rel="stylesheet" href="/static/style.css"/>
</head>
<body>
  <div class="auth-container">
    <div class="card" id="formCard">
      <h1>Request access</h1>
      <p class="sub">Your request will be reviewed by an admin.</p>

      <label for="username">Username</label>
      <input id="username" autocomplete="username" />

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="new-password" />

      <label for="password2">Confirm password</label>
      <input id="password2" type="password" autocomplete="new-password" />

      <label for="full-name">Full Name</label>
      <input id="full-name" type="text">

      <label for="national-id">National ID</label>
      <input id="national-id" minlength="14" maxlength="14">

      <label for="college">College</label>
      <select id="college">
        <option value="">Choose your college</option>
        <option value="Tourism & Hotels">Fauclty of Tourism & Hotels</option>
        <option value="Science">Fauclty of Science</option>
        <option value="Agriculture">Fauclty of Agriculture</option>
        <option value="Engineering">Fauclty of Engineering</option>
        <option value="Medicine">Fauclty of Medicine</option>
        <option value="Pharmacy">Faculty of Pharmacy</option>
        <option value="Dentistry">Fauclty of Dentistry</option>
        <option value="Veterinary Medicine">Fauclty of Veterinary Medicine</option>
        <option value="Nursing">Fauclty of Nursing</option>
        <option value="Computing & Data Science">Fauclty of Computing & Data Science</option>
        <option value="Art">Fauclty of Art</option>
        <option value="Commerce & Business">Fauclty of Commerce & Business</option>
        <option value="Law">Fauclty of Law</option>
        <option value="Education">Fauclty of Education</option>
        <option value="Specific Education">Fauclty of Specific Education</option>
        <option value="Early Childhood Education">Fauclty of Early Childhood Education</option>
        <option value="Fine Arts">Fauclty of Fine Arts</option>
        <option value="Physical Education (Boys)">Fauclty of Physical Education (Boys)</option>
        <option value="Physical Education (Girls)">Fauclty of Physical Education (Girls)</option>
        <option value="Economic Studies & Political Science">Fauclty of Economic Studies & Political Science</option>
      </select>

      <label for="academic-year">Academic Year</label>
      <select id="academic-year">
        <option value="">Choose your Academic year</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>

      <label for="whatsapp-number">Whatsapp Number</label>
      <input id="whatsapp-number" type="tel" minlength="11" maxlength="13">

      <label for="department">Department</label>
      <select id="department">
        <option value="">Choose the department you want to join</option>
        <option value="OC">OC</option>
        <option value="Media">Media</option>
        <option value="HR">HR</option>
        <option value="PR">PR</option>
        <option value="Programming">Programming</option>
        <option value="Art">Art</option>
        <option value="E3lam">E3lam</option>
      </select>
      
      <button id="signupBtn">Submit request</button>
      <div id="msg" class="msg"></div>

      <p class="sub" style="margin-top:1.25rem;text-align:center;">
        Already have an account? <a href="/static/index.html">Log in</a>
      </p>
    </div>

    <div class="card" id="doneCard" style="display:none;">
      <h1>Request received</h1>
      <p class="sub">
        An admin will contact you to schedule an interview.
        You'll be able to log in once approved.
      </p>
      <a href="/static/index.html"><button class="ghost">Back to login</button></a>
    </div>
  </div>

  <script type="module" src="/static/signup.js"></script>
</body>
</html>
